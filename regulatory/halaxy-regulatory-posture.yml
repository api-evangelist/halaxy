  ai_transparency:
    url: https://www.halaxy.com/terms/practitioner/
    evidence:
    - source: https://www.halaxy.com/terms/practitioner/
      http_status: 200
      fetched: '2026-10-22'
      quote: >-
        You acknowledge and agree that the website, including any artificial intelligence or automation tools
        made available on the website, are provided as aids to support you only. The website is not a
        substitute for your own knowledge, expertise, skill, or professional obligations.
    note: >-
      The practitioner terms say AI/automation tools exist in the product (the site navigation advertises an
      "AI Scribe") and present them as decision aids only. This is a limited disclosure. It does not say which
      models are used, what data they process or how outputs are labelled.
  exit_assistance:
    url: https://www.halaxy.com/terms/practitioner/
    evidence:
    - source: https://www.halaxy.com/terms/practitioner/
      http_status: 200
      fetched: '2026-10-22'
      quote: >-
        We also reserve the right to terminate your access to the website or temporarily suspend your access
        to the website for any reason (such as abusive behaviour), in our absolute discretion. In these
        circumstances, acting reasonably, we will provide you with the ability to access information you have
        inputted to download onto your own system.
    - source: https://www.halaxy.com/terms/practitioner/
      http_status: 200
      fetched: '2026-10-22'
      quote: >-
        If we elect to do this, we will take reasonable steps to notify you in advance so that you are able to
        back-up information before it is deleted.
    note: >-
      When Halaxy terminates or suspends an account at its own discretion, it commits to letting you download
      your data, and it gives advance notice before it removes content. The breach and non-payment clauses
      cut the other way: "suspend or terminate your access to all or any information you have inputted into
      the website". No export format or time window is stated.
  data_retention:
    url: https://www.halaxy.com/terms/practitioner/
    section: Are you ensuring that you are meeting your obligations? It’s your responsibility
    evidence:
    - source: https://www.halaxy.com/terms/practitioner/
      http_status: 200
      fetched: '2026-10-22'
      quote: >-
        It is your responsibility to check that storage of and access to information via the website will
        comply with laws applicable to you (including any laws requiring you to retain records in a certain
        way or for a certain number of years).
    note: >-
      Halaxy publishes no retention period of its own. It places statutory record-retention obligations on
      the practitioner. This records an absence of a provider retention schedule, not a retention commitment.
