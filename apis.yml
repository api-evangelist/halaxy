aid: halaxy

name: Halaxy

description: Halaxy is a global health platform built for both practitioners and patients, providing free practice management software including
  online bookings, clinical notes, invoicing and payments, telehealth and patient records for allied health and medical practices in Australia,
  New Zealand, the UK, Ireland, Canada, Singapore and other countries. Its developer portal at developers.halaxy.com documents the Halaxy API,
  a FHIR R4-based REST API (OAuth-secured, with AU and EU production hosts) covering resources such as Patient, Appointment, Practitioner, Schedule,
  Slot, Invoice and Coverage, plus webhooks.

