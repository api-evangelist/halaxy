openapi: 3.2.0
info:
  title: Halaxy Referral Definition API
  description: A FHIR API for Halaxy based on R4 of the FHIR specification
  termsOfService: https://www.halaxy.com/article/terms/practitioner
  contact:
    name: Halaxy Developers
    url: https://www.halaxy.com
    email: community@halaxy.com
  version: '1.104'
servers:
- url: https://au-api.halaxy.com
  description: Production AU
- url: https://eu-api.halaxy.com
  description: Production EU
security:
- oauth: []
tags:
- name: ReferralDefinition
paths:
  /main/ReferralDefinition:
    get:
      operationId: findReferralDefinition
      tags:
      - ReferralDefinition
      responses:
        '200':
          description: ReferralDefinition collection
          content:
            application/fhir+json:
              schema:
                type: object
                readOnly: true
                properties:
                  resourceType:
                    type: string
                    readOnly: true
                    enum:
                    - Bundle
                    default: Bundle
                  timestamp:
                    type: string
                    readOnly: true
                    format: date-time
                  type:
                    type: string
                    readOnly: true
                    enum:
                    - searchset
                    default: searchset
                  entry:
                    type: array
                    items:
                      type: object
                      properties:
                        fullUrl:
                          type: string
                          format: iri-reference
                        resource:
                          type: array
                          items:
                            $ref: '#/components/schemas/ReferralDefinition.jsonfhir'
                        search:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                              - match
                              - include
                              - outcome
                  total:
                    type: integer
                    readOnly: true
                    minimum: 0
                  link:
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        relation:
                          type: string
                          readOnly: true
                          enum:
                          - self
                          - first
                          - last
                          - prev
                          - next
                        url:
                          type: string
                          readOnly: true
                          format: iri-reference
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReferralDefinition'
        '403':
          description: Forbidden
      summary: List ReferralDefinitions
      description: Retrieves a collection of referral type definitions for a practice group
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: _count
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 30
          minimum: 0
        style: form
        explode: false
      - name: pagination
        in: query
        description: Enable or disable pagination
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: _id
        in: query
        description: ID of the referral definition
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: fundingOrganization
        in: query
        description: Funder ID
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      deprecated: false
  /main/ReferralDefinition/{id}:
    get:
      operationId: getReferralDefinition
      tags:
      - ReferralDefinition
      responses:
        '200':
          description: ReferralDefinition resource
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/ReferralDefinition.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralDefinition'
        '403':
          description: Forbidden
        '404':
          description: Resource not found
      summary: Get ReferralDefinition
      description: Retrieves an individual referral type definition
      parameters:
      - name: id
        in: path
        description: ReferralDefinition identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      deprecated: false
