tags:
- name: Document Reference
paths:
  /main/DocumentReference:
    post:
      operationId: createNote
      tags:
      - Document Reference
      responses:
        '201':
          description: DocumentReference resource created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/DocumentReference.jsonfhir'
              example:
                status: current
                docStatus: preliminary
                subject:
                  reference: https://au-api.halaxy.com/main/Patient/12345678
                  type: Patient
                date: '2025-06-10T00:29:43.885Z'
                author:
                - reference: https://au-api.halaxy.com/main/PractitionerRole/PR-345678
                  type: PractitionerRole
                description: My New Clinical Note
                content:
                - attachment:
                    contentType: text/html
                    data: <h1>Hello world!</h1>
                  id: string
                id: string
                meta:
                  lastUpdated: '2025-06-10T00:29:43.885Z'
                  profile: string
                resourceType: string
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentReference'
          links: {}
        '400':
          description: Invalid input
        '403':
          description: Forbidden
        '422':
          description: Unprocessable entity
      summary: Create DocumentReference
      description: Creates a single clinical note in a patient profile
      parameters: []
      requestBody:
        description: The new DocumentReference resource
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/DocumentReference.jsonfhir'
            example:
              resourceType: DocumentReference
              status: current
              docStatus: preliminary
              description: My New Clinical Note
              subject:
                type: Patient
                reference: https://au-api.halaxy.com/main/Patient/12345678
              author:
              - type: PractitionerRole
                reference: https://au-api.halaxy.com/main/PractitionerRole/PR-345678
              content:
              - attachment:
                  contentType: text/html
                  data: <h1>Hello world!</h1>
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentReference'
        required: true
      deprecated: false
