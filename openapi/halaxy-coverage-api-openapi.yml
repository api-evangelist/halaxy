openapi: 3.2.0
info:
  title: Halaxy Coverage API
  description: A FHIR API for Halaxy based on R4 of the FHIR specification
  termsOfService: https://www.halaxy.com/article/terms/practitioner
  contact:
    name: Halaxy Developers
    url: https://www.halaxy.com
    email: community@halaxy.com
  version: '1.104'
servers:
- url: https://au-api.halaxy.com
  description: Production AU
- url: https://eu-api.halaxy.com
  description: Production EU
security:
- oauth: []
tags:
- name: Coverage
paths:
  /main/Coverage:
    get:
      operationId: findCoverage
      tags:
      - Coverage
      responses:
        '200':
          description: Coverage collection
          content:
            application/fhir+json:
              schema:
                type: object
                readOnly: true
                properties:
                  resourceType:
                    type: string
                    readOnly: true
                    enum:
                    - Bundle
                    default: Bundle
                  timestamp:
                    type: string
                    readOnly: true
                    format: date-time
                  type:
                    type: string
                    readOnly: true
                    enum:
                    - searchset
                    default: searchset
                  entry:
                    type: array
                    items:
                      type: object
                      properties:
                        fullUrl:
                          type: string
                          format: iri-reference
                        resource:
                          type: array
                          items:
                            $ref: '#/components/schemas/Coverage.jsonfhir'
                        search:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                              - match
                              - include
                              - outcome
                  total:
                    type: integer
                    readOnly: true
                    minimum: 0
                  link:
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        relation:
                          type: string
                          readOnly: true
                          enum:
                          - self
                          - first
                          - last
                          - prev
                          - next
                        url:
                          type: string
                          readOnly: true
                          format: iri-reference
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coverage'
        '403':
          description: Forbidden
      summary: List Coverage
      description: Retrieves a collection of patient coverage records
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: _count
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 30
          minimum: 0
        style: form
        explode: false
      - name: pagination
        in: query
        description: Enable or disable pagination
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: _id
        in: query
        description: ID of the coverage
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: beneficiary
        in: query
        description: The primary beneficiary of the policy.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: subscriber
        in: query
        description: Subscriber to the policy - can be the same as the policyholder, or different.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: payor
        in: query
        description: Payor is the funder for this coverage
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: coverageOrganization
        in: query
        description: The coverage organisation for this coverage
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: subscriberId
        in: query
        description: Subscriber identifier number.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: _lastUpdated
        in: query
        description: Date the coverage was last updated.
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      - name: created
        in: query
        description: Date the coverage was created.
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      - name: _include
        in: query
        description: 'The `_include` parameter can be used to include related search results to reduce overall network delay of repeated retrievals of related resources.


          **Modifiers**

          - `_include:iterate` = can be used to include related resources based on already included resources.'
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - Coverage:beneficiary
          - Coverage:subscriber
          - Coverage:payor
        style: form
        explode: false
        allowReserved: false
      - name: _sort
        in: query
        description: Each item in the comma-separated list is a search parameter, optionally with a \' - \' prefix. The prefix indicates decreasing order; in its absence, the parameter is applied in increasing order.
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - _lastUpdated
          - created
          - -_lastUpdated
          - -created
        style: form
        explode: false
      deprecated: false
    post:
      operationId: createCoverage
      tags:
      - Coverage
      responses:
        '201':
          description: Coverage resource created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Coverage.jsonfhir'
              example:
                identifier:
                - type:
                    coding:
                    - system: http://terminology.hl7.org/CodeSystem/v2-0203
                      code: MC
                      display: Patient's Medicare number
                    text: Patient's Medicare number
                  system: http://ns.electronichealth.net.au/id/medicare-number
                  value: '3950377531'
                status: active
                subscriber:
                  reference: https://au-api.halaxy.com/main/Patient/123456789
                  type: Patient
                subscriberId: '3950377531'
                beneficiary:
                  reference: https://au-api.halaxy.com/main/Patient/123456789
                  type: Patient
                dependent: '1'
                period:
                  end: 2030-07
                payor:
                - reference: https://au-api.halaxy.com/main/Organization/FD-905361
                  type: Organization
                extension:
                - url: https://terminology.halaxy.com/StructureDefinition/coverage-payer
                  valueCoding:
                    system: https://au-api.halaxy.com/main/FunderType/payer
                    code: '29'
                    display: Patient
                id: '70217037'
                resourceType: Coverage
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
          links: {}
        '400':
          description: Invalid input
        '403':
          description: Forbidden
        '422':
          description: Unprocessable entity
      summary: Create Coverage
      description: Creates a new coverage record for a patient
      parameters: []
      requestBody:
        description: ''
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Coverage.jsonfhir'
            example:
              subscriber:
                reference: https://au-api.halaxy.com/main/Patient/123456789
                type: Patient
              beneficiary:
                type: Patient
                reference: https://au-api.halaxy.com/main/Patient/123456789
              period:
                end: 2030-07
              identifier:
              - type:
                  coding:
                  - system: http://terminology.hl7.org/CodeSystem/v2-0203
                    code: MC
                    display: Patient Medicare number
                  text: Patient Medicare number
                assigner:
                  type: Organization
                  reference: https://au-api.halaxy.com/main/Organization/FD-123456
                use: usual
                system: http://ns.electronichealth.net.au/id/medicare-number
                value: '3950377531'
              status: active
              subscriberId: '3950377531'
              dependent: '1'
              payor:
              - reference: https://au-api.halaxy.com/main/Organization/FD-123456
                type: Organization
              extension:
              - url: https://terminology.halaxy.com/StructureDefinition/coverage-payer
                valueCoding:
                  system: https://au-api.halaxy.com/main/FunderType/payer
                  code: '29'
                  display: Patient
              resourceType: Coverage
          application/json:
            schema:
              $ref: '#/components/schemas/Coverage'
        required: false
      deprecated: false
  /main/Coverage/{id}:
    get:
      operationId: getCoverage
      tags:
      - Coverage
      responses:
        '200':
          description: Coverage resource
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Coverage.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
        '403':
          description: Forbidden
        '404':
          description: Resource not found
      summary: Get Coverage
      description: Retrieves an individual patient coverage record
      parameters:
      - name: id
        in: path
        description: Coverage identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      deprecated: false
    patch:
      operationId: patchCoverage
      tags:
      - Coverage
      responses:
        '200':
          description: Coverage resource updated
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Coverage.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
          links: {}
        '400':
          description: Invalid input
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Unprocessable entity
      summary: Update Coverage
      description: Updates specific fields in existing patient claim details
      parameters:
      - name: id
        in: path
        description: Coverage identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      requestBody:
        description: The updated Coverage resource
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/Coverage'
        required: true
      deprecated: false
components:
  schemas:
    Coverage.jsonfhir:
      type: object
      description: A Coverage. See https://hl7.org/fhir/R4/coverage.html
      deprecated: false
      properties:
        identifier:
          description: Business Identifier for the coverage
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FhirIdentifier.jsonfhir'
        status:
          description: The status of the coverage
          type: string
          enum:
          - active
          - cancelled
        subscriber:
          description: The person receiving the treatment under the coverage
          anyOf:
          - $ref: '#/components/schemas/FhirReference.jsonfhir'
          - type: 'null'
        subscriberId:
          description: The patient's claim details (e.g. membership number, card number, reference number)
          type:
          - string
          - 'null'
        beneficiary:
          description: The person who receives the benefit for the coverage
          anyOf:
          - $ref: '#/components/schemas/FhirReference.jsonfhir'
          - type: 'null'
        dependent:
          description: An individual reference number (IRN) on the membership card, typically a single digit number before the cardholder's name
          type:
          - string
          - 'null'
        period:
          description: The time period when the coverage was valid
          anyOf:
          - $ref: '#/components/schemas/FhirPeriodYearMonth.jsonfhir'
          - type: 'null'
        payor:
          description: The issuer of the coverage policy - if Organization, this is the funder (FD) ID.
          type: array
          items:
            $ref: '#/components/schemas/FhirReference.jsonfhir'
        attachments:
          description: File attachments to the coverage
          type: array
          items:
            $ref: '#/components/schemas/FhirAttachment.jsonfhir'
        text:
          readOnly: true
          description: Text summary of the resource, for human interpretation
          anyOf:
          - $ref: '#/components/schemas/FhirNarrative.jsonfhir'
          - type: 'null'
        contained:
          readOnly: true
          description: Contained, inline Resources
          type: array
          items:
            $ref: '#/components/schemas/FhirResourceInterface.jsonfhir'
        id:
          readOnly: true
          description: Logical id of this artifact
          type:
          - string
          - 'null'
        meta:
          description: Metadata about the resource
          anyOf:
          - $ref: '#/components/schemas/FhirResourceMeta.jsonfhir'
          - type: 'null'
        resourceType:
          description: Resource Type
          type:
          - string
          - 'null'
    FhirNarrative:
      type: object
      description: ''
      deprecated: false
      properties:
        status:
          readOnly: true
          description: Describes how the narrative was generated
          type: string
          enum:
          - generated
          - extensions
          - additional
          - empty
        div:
          readOnly: true
          description: Limited xhtml content
          type: string
        id:
          readOnly: true
          description: ID of the FHIR element (optional)
          type:
          - string
          - 'null'
    Coverage:
