          - cancelled
        subscriber:
          description: The person receiving the treatment under the coverage
          anyOf:
          - $ref: '#/components/schemas/FhirReference'
          - type: 'null'
        subscriberId:
          description: The patient's claim details (e.g. membership number, card number, reference number)
          type:
          - string
          - 'null'
        beneficiary:
          description: The person who receives the benefit for the coverage
          anyOf:
          - $ref: '#/components/schemas/FhirReference'
          - type: 'null'
        dependent:
          description: An individual reference number (IRN) on the membership card, typically a single digit number before the cardholder's name
          type:
          - string
          - 'null'
        period:
          description: The time period when the coverage was valid
          anyOf:
          - $ref: '#/components/schemas/FhirPeriodYearMonth'
          - type: 'null'
        payor:
          description: The issuer of the coverage policy - if Organization, this is the funder (FD) ID.
          type: array
          items:
            $ref: '#/components/schemas/FhirReference'
        attachments:
          description: File attachments to the coverage
          type: array
          items:
            $ref: '#/components/schemas/FhirAttachment'
        text:
          readOnly: true
          description: Text summary of the resource, for human interpretation
          anyOf:
          - $ref: '#/components/schemas/FhirNarrative'
          - type: 'null'
        contained:
          readOnly: true
          description: Contained, inline Resources
          type: array
          items:
            $ref: '#/components/schemas/FhirResourceInterface'
        id:
          readOnly: true
          description: Logical id of this artifact
          type:
          - string
          - 'null'
        meta:
          description: Metadata about the resource
          anyOf:
          - $ref: '#/components/schemas/FhirResourceMeta'
          - type: 'null'
        resourceType:
          description: Resource Type
          type:
          - string
          - 'null'
    FhirAttachment:
      type: object
      description: ''
      deprecated: false
      properties:
        data:
          description: The file encoded to base64 (maximum 20MB)
          type: string
        contentType:
          description: The file format of the file attachment
          type: string
          enum:
          - application/json
          - application/xml
          - application/msword
          - application/vnd.ms-excel
          - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
