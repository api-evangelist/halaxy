openapi: 3.2.0
info:
  title: Halaxy Referral API
  description: A FHIR API for Halaxy based on R4 of the FHIR specification
  termsOfService: https://www.halaxy.com/article/terms/practitioner
  contact:
    name: Halaxy Developers
    url: https://www.halaxy.com
    email: community@halaxy.com
  version: '1.104'
servers:
- url: https://au-api.halaxy.com
  description: Production AU
- url: https://eu-api.halaxy.com
  description: Production EU
security:
- oauth: []
tags:
- name: Referral
paths:
  /main/Referral:
    get:
      operationId: findReferral
      tags:
      - Referral
      responses:
        '200':
          description: Referral collection
          content:
            application/fhir+json:
              schema:
                type: object
                readOnly: true
                properties:
                  resourceType:
                    type: string
                    readOnly: true
                    enum:
                    - Bundle
                    default: Bundle
                  timestamp:
                    type: string
                    readOnly: true
                    format: date-time
                  type:
                    type: string
                    readOnly: true
                    enum:
                    - searchset
                    default: searchset
                  entry:
                    type: array
                    items:
                      type: object
                      properties:
                        fullUrl:
                          type: string
                          format: iri-reference
                        resource:
                          type: array
                          items:
                            $ref: '#/components/schemas/Referral.jsonfhir'
                        search:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                              - match
                              - include
                              - outcome
                  total:
                    type: integer
                    readOnly: true
                    minimum: 0
                  link:
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        relation:
                          type: string
                          readOnly: true
                          enum:
                          - self
                          - first
                          - last
                          - prev
                          - next
                        url:
                          type: string
                          readOnly: true
                          format: iri-reference
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Referral'
        '403':
          description: Forbidden
      summary: List Referrals
      description: Retrieves a collection of referral records for patients in a practice group
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: _count
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 30
          minimum: 0
        style: form
        explode: false
      - name: pagination
        in: query
        description: Enable or disable pagination
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: _id
        in: query
        description: ID of the referral
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: subject
        in: query
        description: Patient who is the subject of the referral
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: coverage
        in: query
        description: Reference to the coverage for the referral. In Halaxy a Coverage record relates to the Claim details in the UI
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: _lastUpdated
        in: query
        description: Date the referral was last updated.
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      - name: created
        in: query
        description: Date the referral was created.
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      - name: _include
        in: query
        description: 'The `_include` parameter can be used to include related search results to reduce overall network delay of repeated retrievals of related resources.


          **Modifiers**

          - `_include:iterate` = can be used to include related resources based on already included resources.'
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - Referral:subject
          - Referral:coverage
        style: form
        explode: false
        allowReserved: false
      - name: _sort
        in: query
        description: Each item in the comma-separated list is a search parameter, optionally with a \' - \' prefix. The prefix indicates decreasing order; in its absence, the parameter is applied in increasing order.
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - _lastUpdated
          - created
          - -_lastUpdated
          - -created
        style: form
        explode: false
      deprecated: false
    post:
      operationId: createReferral
      tags:
      - Referral
      responses:
        '201':
          description: Referral resource created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Referral.jsonfhir'
              example:
                coverage:
                  reference: https://au-api.halaxy.com/main/Coverage/12345678
                  type: Coverage
                period:
                  start: '2025-09-01'
                  end: '2026-09-01'
                performer:
                  reference: https://au-api.halaxy.com/main/Practitioner/PR-1234567
                  type: Practitioner
                requester:
                  reference: https://au-api.halaxy.com/main/PractitionerRole/EP-1234567
                  type: PractitionerRole
                created: '2025-09-02T11:00:30+10:00'
                priority: false
                active: true
                limitQuantity:
                  quantity:
                    value: 6
                    unit: appointment
                    system: http://unitsofmeasure.org
                  quantityUsed: 0
                limitMoney:
                  amountUsed: 0
                subject:
                  reference: https://au-api.halaxy.com/main/Patient/123456789
                  type: Patient
                includeCancelledAppointment: false
                id: '89869403'
                meta:
                  lastUpdated: '2025-09-02T11:00:30+10:00'
                resourceType: Referral
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
          links: {}
        '400':
          description: Invalid input
        '403':
          description: Forbidden
        '422':
          description: Unprocessable entity
      summary: Create Referral
      description: Creates a new Referral record
      parameters: []
      requestBody:
        description: ''
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Referral.jsonfhir'
          application/json:
            schema:
              $ref: '#/components/schemas/Referral'
        required: false
      deprecated: false
  /main/Referral/{id}:
    get:
      operationId: getReferral
      tags:
      - Referral
      responses:
        '200':
          description: Referral resource
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Referral.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
        '403':
          description: Forbidden
        '404':
          description: Resource not found
      summary: Get Referral
      description: Retrieves an individual referral record
      parameters:
      - name: id
        in: path
        description: Referral identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      deprecated: false
    patch:
      operationId: patchReferral
      tags:
      - Referral
      responses:
        '200':
          description: Referral resource updated
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Referral.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/Referral'
          links: {}
        '400':
          description: Invalid input
        '403':
          description: Forbidden
        '404':
          description: Resource not found
        '422':
          description: Unprocessable entity
      summary: Update Referral
      description: Updates specific fields in an existing referral
      parameters:
      - name: id
        in: path
        description: Referral identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      requestBody:
        description: ''
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/Referral'
        required: false
      deprecated: false
components:
