        allocationType:
          description: Specifies whether the referral amount is applied to appointment fees only or to all fee types
          type:
          - string
          - 'null'
          enum:
          - Appointments only
          - All fee types
          - null
        amountUsed:
          description: The amount of the monetary value used in the referral
          type:
          - number
          - 'null'
        id:
          readOnly: true
          description: ID of the FHIR element (optional)
          type:
          - string
          - 'null'
    FhirNarrative:
      type: object
      description: ''
      deprecated: false
      properties:
        status:
          readOnly: true
          description: Describes how the narrative was generated
          type: string
          enum:
          - generated
          - extensions
          - additional
          - empty
        div:
          readOnly: true
          description: Limited xhtml content
          type: string
        id:
          readOnly: true
          description: ID of the FHIR element (optional)
          type:
          - string
          - 'null'
    LimitQuantity.jsonfhir:
