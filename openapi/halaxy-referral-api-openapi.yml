          - bn
          - cs
          - da
          - de
          - el
          - en
          - en-AU
          - es
          - fi
          - fr
          - fy
          - hi
          - hr
          - it
          - ja
          - ko
          - nl
          - 'no'
          - pa
          - pl
          - pt
          - ru
          - sr
          - sv
          - te
          - zh
          - null
        url:
          description: Uri where the data can be found
          type:
          - string
          - 'null'
        size:
          description: Number of bytes of content (if url provided)
          type:
          - integer
          - 'null'
        hash:
          description: Hash of the data (sha-1, base64ed)
          type:
          - string
          - 'null'
        title:
          description: The file name
          type:
          - string
          - 'null'
        creation:
