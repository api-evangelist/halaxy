          type:
          - string
          - 'null'
          format: date-time
        priority:
          readOnly: true
          description: If true, appointments with fees using the same funder automatically apply this referral. If false (or null), the most recently created referral is applied instead
          type:
          - boolean
          - 'null'
        active:
          description: Indicates if this referral is an active and valid referral
          type:
          - boolean
          - 'null'
        limitQuantity:
          description: Limit on the quantity of services
          anyOf:
          - $ref: '#/components/schemas/LimitQuantity.jsonfhir'
          - type: 'null'
        limitMoney:
          description: Limit on the monetary value of services
          anyOf:
          - $ref: '#/components/schemas/LimitMoney.jsonfhir'
          - type: 'null'
        subject:
          description: The URL reference to the patient whom this referral is for
          anyOf:
          - $ref: '#/components/schemas/FhirReference.jsonfhir'
          - type: 'null'
        includeCancelledAppointment:
          description: Indicates whether the referral is also applied to cancelled appointments
          type:
          - boolean
          - 'null'
        comment:
          description: Notes added to the referral
          type:
          - string
          - 'null'
        expiryType:
          readOnly: true
          description: Type of referral expiry - Medicare and DVA referrals only
          type:
          - string
          - 'null'
          enum:
          - standard
          - non-standard
          - indefinite
          - null
        attachments:
          description: File attachments to the referral
          type: array
          items:
            $ref: '#/components/schemas/FhirAttachment.jsonfhir'
        text:
