openapi: 3.2.0
info:
  title: Halaxy Invoice API
  description: A FHIR API for Halaxy based on R4 of the FHIR specification
  termsOfService: https://www.halaxy.com/article/terms/practitioner
  contact:
    name: Halaxy Developers
    url: https://www.halaxy.com
    email: community@halaxy.com
  version: '1.104'
servers:
- url: https://au-api.halaxy.com
  description: Production AU
- url: https://eu-api.halaxy.com
  description: Production EU
security:
- oauth: []
tags:
- name: Invoice
paths:
  /main/Invoice:
    get:
      operationId: findInvoice
      tags:
      - Invoice
      responses:
        '200':
          description: Invoice collection
          content:
            application/fhir+json:
              schema:
                type: object
                readOnly: true
                properties:
                  resourceType:
                    type: string
                    readOnly: true
                    enum:
                    - Bundle
                    default: Bundle
                  timestamp:
                    type: string
                    readOnly: true
                    format: date-time
                  type:
                    type: string
                    readOnly: true
                    enum:
                    - searchset
                    default: searchset
                  entry:
                    type: array
                    items:
                      type: object
                      properties:
                        fullUrl:
                          type: string
                          format: iri-reference
                        resource:
                          type: array
                          items:
                            $ref: '#/components/schemas/Invoice.jsonfhir'
                        search:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                              - match
                              - include
                              - outcome
                  total:
                    type: integer
                    readOnly: true
                    minimum: 0
                  link:
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        relation:
                          type: string
                          readOnly: true
                          enum:
                          - self
                          - first
                          - last
                          - prev
                          - next
                        url:
                          type: string
                          readOnly: true
                          format: iri-reference
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
        '403':
          description: Forbidden
      summary: List Invoices
      description: Retrieves a collection of invoices in a practice group
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: _count
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 30
          minimum: 0
        style: form
        explode: false
      - name: pagination
        in: query
        description: Enable or disable pagination
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: _id
        in: query
        description: ID of the invoice
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: _lastUpdated
        in: query
        description: Date the invoice was last updated.
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      - name: created
        in: query
        description: Date the invoice was created.
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      - name: recipient
        in: query
        description: The Recipient of the invoice, can be patient or organization
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: practitioner
        in: query
        description: Reference to the practitioner or practitioner role for the invoice
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: practitioner-role
        in: query
        description: Reference to the practitioner role for the invoice
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: organization
        in: query
        description: Filter the clinic to where the invoice was created
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: status
        in: query
        description: Reference to the coverage for the invoice
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: totalPaid
        in: query
        description: The total paid amount of the invoice
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: totalBalance
        in: query
        description: The balance amount of the invoice
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: _include
        in: query
        description: 'The `_include` parameter can be used to include related search results to reduce overall network delay of repeated retrievals of related resources.


          **Modifiers**

          - `_include:iterate` = can be used to include related resources based on already included resources.'
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - Invoice:recipient
          - Invoice:practitioner
          - PractitionerRole:practitioner
          - PractitionerRole:organization
        style: form
        explode: false
      deprecated: false
  /main/Invoice/{id}:
    get:
      operationId: getInvoice
      tags:
      - Invoice
      responses:
        '200':
          description: Invoice resource
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Invoice.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '403':
          description: Forbidden
        '404':
          description: Resource not found
      summary: Get Invoice
      description: Retrieves an individual invoice
      parameters:
      - name: id
        in: path
        description: Invoice identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      deprecated: false
