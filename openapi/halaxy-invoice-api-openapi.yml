          - type: 'null'
        assigner:
          description: Organization that issued id (may be just text)
          anyOf:
          - $ref: '#/components/schemas/FhirReference'
          - type: 'null'
        id:
          readOnly: true
          description: ID of the FHIR element (optional)
          type:
          - string
          - 'null'
    FhirResourceInterface:
      type: object
      description: ''
      deprecated: false
    Invoice.jsonfhir:
      type: object
      description: An Invoice.
      deprecated: false
      properties:
        identifier:
          description: Business Identifier for item
          type: array
          items:
            $ref: '#/components/schemas/FhirIdentifier.jsonfhir'
        recipient:
          description: The individual or organization billed on this invoice (patient or organization)
          anyOf:
          - $ref: '#/components/schemas/FhirReference.jsonfhir'
          - type: 'null'
        status:
          description: Status of the invoice
          type:
          - string
          - 'null'
          enum:
          - active
          - deleted
          - issued
          - write-off
          - pending-confirmation
          - null
        date:
          description: Date of the invoice
          type:
          - string
          - 'null'
          format: date-time
        dueDate:
          description: Due date of the invoice
          type:
          - string
          - 'null'
          format: date-time
        payorType:
          description: Type of payor billed on the invoice
          type:
          - string
          - 'null'
          enum:
          - organisation
          - patient
          - null
        title:
          description: The patient's name as the invoice title
          type:
          - string
          - 'null'
        type:
          description: The kind of invoice document - e.g. invoice or quote
          anyOf:
          - $ref: '#/components/schemas/FhirCodeableConcept.jsonfhir'
          - type: 'null'
        practitioner:
          description: PractitionerRole (practitioner and location) who created the invoice
          anyOf:
          - $ref: '#/components/schemas/FhirReference.jsonfhir'
          - type: 'null'
        note:
          description: Additional comments in the Notes section of the invoice (may contain HTML elements)
          anyOf:
          - $ref: '#/components/schemas/FhirAnnotation.jsonfhir'
          - type: 'null'
        totalNet:
          description: Total amount of the invoice without taxes
          anyOf:
          - $ref: '#/components/schemas/FhirMoney.jsonfhir'
          - type: 'null'
        totalGross:
          description: Total amount of the invoice with taxes
          anyOf:
          - $ref: '#/components/schemas/FhirMoney.jsonfhir'
          - type: 'null'
        totalBalance:
          description: Total unpaid amount on the invoice
          anyOf:
          - $ref: '#/components/schemas/FhirMoney.jsonfhir'
          - type: 'null'
        totalTax:
          description: Total amount of the taxes
          anyOf:
          - $ref: '#/components/schemas/FhirMoney.jsonfhir'
          - type: 'null'
        totalPaid:
          description: Total paid amount on the invoice
          anyOf:
          - $ref: '#/components/schemas/FhirMoney.jsonfhir'
          - type: 'null'
        text:
          readOnly: true
          description: Text summary of the resource, for human interpretation
          anyOf:
          - $ref: '#/components/schemas/FhirNarrative.jsonfhir'
          - type: 'null'
        contained:
          readOnly: true
          description: Contained, inline Resources
          type: array
          items:
            $ref: '#/components/schemas/FhirResourceInterface.jsonfhir'
        id:
          readOnly: true
          description: Logical id of this artifact
          type:
          - string
          - 'null'
        meta:
          description: Metadata about the resource
          anyOf:
          - $ref: '#/components/schemas/FhirResourceMeta.jsonfhir'
          - type: 'null'
        resourceType:
          description: Resource Type
          type:
          - string
          - 'null'
