openapi: 3.2.0
info:
  title: Halaxy Charge Item Definition API
  description: A FHIR API for Halaxy based on R4 of the FHIR specification
  termsOfService: https://www.halaxy.com/article/terms/practitioner
  contact:
    name: Halaxy Developers
    url: https://www.halaxy.com
    email: community@halaxy.com
  version: '1.104'
servers:
- url: https://au-api.halaxy.com
  description: Production AU
- url: https://eu-api.halaxy.com
  description: Production EU
security:
- oauth: []
tags:
- name: ChargeItemDefinition
paths:
  /main/ChargeItemDefinition:
    get:
      operationId: findChargeItemDefinitions
      tags:
      - ChargeItemDefinition
      responses:
        '200':
          description: ChargeItemDefinition collection
          content:
            application/fhir+json:
              schema:
                type: object
                readOnly: true
                properties:
                  resourceType:
                    type: string
                    readOnly: true
                    enum:
                    - Bundle
                    default: Bundle
                  timestamp:
                    type: string
                    readOnly: true
                    format: date-time
                  type:
                    type: string
                    readOnly: true
                    enum:
                    - searchset
                    default: searchset
                  entry:
                    type: array
                    items:
                      type: object
                      properties:
                        fullUrl:
                          type: string
                          format: iri-reference
                        resource:
                          type: array
                          items:
                            $ref: '#/components/schemas/ChargeItemDefinition.jsonfhir'
                        search:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                              - match
                              - include
                              - outcome
                  total:
                    type: integer
                    readOnly: true
                    minimum: 0
                  link:
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        relation:
                          type: string
                          readOnly: true
                          enum:
                          - self
                          - first
                          - last
                          - prev
                          - next
                        url:
                          type: string
                          readOnly: true
                          format: iri-reference
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChargeItemDefinition'
        '403':
          description: Forbidden
      summary: List ChargeItemDefinitions
      description: Retrieves a list or collection of fees
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: _count
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 30
          minimum: 0
        style: form
        explode: false
      - name: pagination
        in: query
        description: Enable or disable pagination
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: _id
        in: query
        description: The logical id of the resource
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: context-type
        in: query
        description: 'Type of resource (fee type: 0=Appointment, 1=Item, 2=ProRata)'
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
          - '2'
        style: form
        explode: false
      - name: property-group-status
        in: query
        description: 'Status of propertyGroup extension coding (fee pricing status: 1=current, 2=archived)'
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - '1'
          - '2'
        style: form
        explode: false
      - name: created
        in: query
        description: When the resource was created
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      - name: title
        in: query
        description: Title of the resource (fee name)
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: publisher
        in: query
        description: Publisher of the resource (funder name)
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: code
        in: query
        description: Resource code (fee item number)
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: _lastUpdated
        in: query
        description: Date the resource was last updated
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      deprecated: false
  /main/ChargeItemDefinition/{id}:
    get:
      operationId: getChargeItemDefinition
      tags:
      - ChargeItemDefinition
      responses:
        '200':
          description: ChargeItemDefinition resource
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/ChargeItemDefinition.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeItemDefinition'
        '403':
          description: Forbidden
        '404':
          description: Resource not found
      summary: Get ChargeItemDefinition
      description: Retrieves an individual fee
      parameters:
      - name: id
        in: path
        description: ChargeItemDefinition identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      deprecated: false
components:
  schemas:
    FhirPropertyGroup.jsonfhir:
      type: object
      description: ''
      deprecated: false
      properties:
        applicability:
          description: Filters that determine when to apply the pricing block to a fee (e.g. level or date range)
          type: array
          items:
            $ref: '#/components/schemas/FhirApplicability.jsonfhir'
        priceComponent:
          description: The price, tax and rebate breakdown for this pricing block
          type: array
          items:
            $ref: '#/components/schemas/FhirMonetaryComponent.jsonfhir'
        id:
          readOnly: true
          description: ID of the FHIR element (optional)
          type:
          - string
          - 'null'
    ChargeItemDefinition.jsonfhir:
      type: object
      description: A ChargeItemDefinition (Fee).
      deprecated: false
      properties:
        title:
          description: The name of the fee (e.g. Short Consultation)
          type:
          - string
          - 'null'
        code:
          description: The item number or code of the fee
          anyOf:
          - $ref: '#/components/schemas/FhirCodeableConcept.jsonfhir'
          - type: 'null'
        status:
          description: The status of the fee - active if propertyGroup is current, retired if propertyGroup is archived, unknown if fee has multiple records of propertyGroup
          default: unknown
          example: unknown
          type:
          - string
          - 'null'
          enum:
          - draft
          - active
          - retired
          - unknown
          - null
        useContext:
          description: The fee type and fee category of this fee
          type: array
          items:
            $ref: '#/components/schemas/FhirUsageContext.jsonfhir'
        publisher:
          description: The name of the funder of this fee
          type:
          - string
          - 'null'
        date:
          description: The date when the fee was last modified
          type:
          - string
          - 'null'
          format: date-time
        propertyGroup:
          description: An individual pricing block for this fee
          type: array
          items:
            $ref: '#/components/schemas/FhirPropertyGroup.jsonfhir'
        text:
          readOnly: true
          description: Text summary of the resource, for human interpretation
          anyOf:
          - $ref: '#/components/schemas/FhirNarrative.jsonfhir'
          - type: 'null'
        contained:
          readOnly: true
          description: Contained, inline Resources
          type: array
          items:
            $ref: '#/components/schemas/FhirResourceInterface.jsonfhir'
        id:
          readOnly: true
          description: Logical id of this artifact
          type:
          - string
          - 'null'
        meta:
          description: Metadata about the resource
          anyOf:
          - $ref: '#/components/schemas/FhirResourceMeta.jsonfhir'
          - type: 'null'
        resourceType:
          description: Resource Type
          type:
          - string
          - 'null'
    FhirNarrative:
      type: object
      description: ''
      deprecated: false
      properties:
        status:
          readOnly: true
          description: Describes how the narrative was generated
          type: string
          enum:
          - generated
          - extensions
          - additional
          - empty
        div:
          readOnly: true
          description: Limited xhtml content
          type: string
        id:
          readOnly: true
          description: ID of the FHIR element (optional)
          type:
          - string
          - 'null'
    FhirUsageContext.jsonfhir:
      type: object
      description: ''
      deprecated: false
      properties:
        code:
          description: Metadata that can be used to retrieve an artifact
          anyOf:
          - $ref: '#/components/schemas/FhirCoding.jsonfhir'
          - type: 'null'
        valueCodeableConcept:
          description: The context is represented by a CodeableConcept referencing one or more terminologies or text
          anyOf:
          - $ref: '#/components/schemas/FhirCodeableConcept.jsonfhir'
          - type: 'null'
        valueQuantity:
          description: The context is represented by a measured amount
          anyOf:
          - $ref: '#/components/schemas/FhirQuantity.jsonfhir'
          - type: 'null'
        valueRange:
          description: The context is represented by a set of ordered Quantity values with a low and high limit
          anyOf:
          - $ref: '#/components/schemas/FhirRange.jsonfhir'
          - type: 'null'
        valueReference:
          description: The context is represented by the reference of another resource
          anyOf:
          - $ref: '#/components/schemas/FhirReference.jsonfhir'
          - type: 'null'
        id:
          readOnly: true
          description: ID of the FHIR element (optional)
          type:
          - string
          - 'null'
    FhirRange.jsonfhir:
      type: object
      description: ''
      deprecated: false
      properties:
        low:
          description: 'The low limit. The boundary is inclusive. (e.g: 0)'
          anyOf:
          - $ref: '#/components/schemas/FhirQuantity.jsonfhir'
          - type: 'null'
        high:
          description: 'The high limit. The boundary is inclusive. (e.g: 1)'
          anyOf:
          - $ref: '#/components/schemas/FhirQuantity.jsonfhir'
