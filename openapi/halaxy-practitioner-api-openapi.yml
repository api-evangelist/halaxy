openapi: 3.2.0
info:
  title: Halaxy Practitioner API
  description: A FHIR API for Halaxy based on R4 of the FHIR specification
  termsOfService: https://www.halaxy.com/article/terms/practitioner
  contact:
    name: Halaxy Developers
    url: https://www.halaxy.com
    email: community@halaxy.com
  version: '1.104'
servers:
- url: https://au-api.halaxy.com
  description: Production AU
- url: https://eu-api.halaxy.com
  description: Production EU
security:
- oauth: []
tags:
- name: Practitioner
paths:
  /main/Practitioner:
    get:
      operationId: findPractitioner
      tags:
      - Practitioner
      responses:
        '200':
          description: Practitioner collection
          content:
            application/fhir+json:
              schema:
                type: object
                readOnly: true
                properties:
                  resourceType:
                    type: string
                    readOnly: true
                    enum:
                    - Bundle
                    default: Bundle
                  timestamp:
                    type: string
                    readOnly: true
                    format: date-time
                  type:
                    type: string
                    readOnly: true
                    enum:
                    - searchset
                    default: searchset
                  entry:
                    type: array
                    items:
                      type: object
                      properties:
                        fullUrl:
                          type: string
                          format: iri-reference
                        resource:
                          type: array
                          items:
                            $ref: '#/components/schemas/Practitioner.jsonfhir'
                        search:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                              - match
                              - include
                              - outcome
                  total:
                    type: integer
                    readOnly: true
                    minimum: 0
                  link:
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        relation:
                          type: string
                          readOnly: true
                          enum:
                          - self
                          - first
                          - last
                          - prev
                          - next
                        url:
                          type: string
                          readOnly: true
                          format: iri-reference
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Practitioner'
        '403':
          description: Forbidden
      summary: List Practitioners
      description: Retrieves a collection of practitioner and administrator records within a practice group
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: _count
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 30
          minimum: 0
        style: form
        explode: false
      - name: pagination
        in: query
        description: Enable or disable pagination
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: _summary[]
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: array
          items:
            type: string
            enum:
            - 'false'
            - data
            - count
            - Default
            - text
        style: form
        explode: true
      - name: _id
        in: query
        description: The logical id of the resource
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: name
        in: query
        description: The family, given or preferred name of the resource
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: family
        in: query
        description: The family portion of the name
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: given
        in: query
        description: The given portion of the name
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: email
        in: query
        description: A value in an email contact
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: active
        in: query
        description: Whether the practitioner is active
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: _profile
        in: query
        description: The `_profile` parameter can be used to select different types of a resources.
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - StructureDefinition/hx-practitioner
          - StructureDefinition/hx-external-practitioner
        style: form
        explode: false
      - name: _lastUpdated
        in: query
        description: Practitioner _lastUpdated
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      - name: _sort
        in: query
        description: Each item in the comma-separated list is a search parameter, optionally with a \' - \' prefix. The prefix indicates decreasing order; in its absence, the parameter is applied in increasing order.
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - name
          - -name
        style: form
        explode: false
      deprecated: false
    post:
      operationId: createPractitioner
      tags:
      - Practitioner
      responses:
        '201':
          description: Practitioner resource created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Practitioner.jsonfhir'
              example:
                active: true
                name:
                - use: official
                  text: Dr Mary Jones
                  family: Jones
                  given:
                  - Mary
                  prefix:
                  - Dr
                gender: female
                id: EP-17141237
                meta:
                  lastUpdated: '2025-06-05T16:54:56+10:00'
                  profile: https://au-api.halaxy.com/main/StructureDefinition/hx-external-practitioner
                resourceType: Practitioner
            application/json:
              schema:
                $ref: '#/components/schemas/Practitioner'
          links: {}
        '400':
          description: Invalid input
        '403':
          description: Forbidden
        '422':
          description: Unprocessable entity
      summary: Create Practitioner (Professional Contact)
      description: Creates a new professional contact profile (i.e. external practitioner)
      parameters: []
      requestBody:
        description: The new Practitioner resource
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Practitioner.jsonfhir'
            example:
              meta:
                profile: https://au-api.halaxy.com/main/StructureDefinition/hx-external-practitioner
              active: true
              name:
              - use: official
                family: Jones
                given:
                - Mary
                prefix:
                - Dr
              gender: female
              qualification:
              - code:
                  coding:
                  - system: https://terminology.halaxy.com/fhir/Codesystem/profession
                    display: GP (General Practitioner)
          application/json:
            schema:
              $ref: '#/components/schemas/Practitioner'
        required: true
      deprecated: false
  /main/Practitioner/{id}:
    get:
      operationId: getPractitioner
      tags:
      - Practitioner
      responses:
        '200':
          description: Practitioner resource
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Practitioner.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/Practitioner'
        '403':
          description: Forbidden
        '404':
          description: Resource not found
      summary: Get Practitioner
      description: Retrieves an individual practitioner or administrator record within a practice group
      parameters:
      - name: id
        in: path
        description: Practitioner identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      deprecated: false
