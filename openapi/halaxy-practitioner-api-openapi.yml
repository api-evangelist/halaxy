        active:
          description: Indicates if the user's record is in active use - changes to false if the user's profile is deactivated from the practice group
          type:
          - boolean
          - 'null'
        name:
          description: The name/s associated with the practitioner
          type: array
          items:
            $ref: '#/components/schemas/FhirHumanName'
        telecom:
          description: A unique email address linked to the practitioner
          type: array
          items:
            $ref: '#/components/schemas/FhirContactPoint'
        address:
          description: Address(es) of the practitioner that are not role specific
          type: array
          items:
            $ref: '#/components/schemas/FhirAddress'
        gender:
          description: male | female | other | unknown
          type:
          - string
          - 'null'
          enum:
          - male
          - female
          - other
          - unknown
          - null
