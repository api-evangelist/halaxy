openapi: 3.2.0
info:
  title: Halaxy Invoice Line API
  description: A FHIR API for Halaxy based on R4 of the FHIR specification
  termsOfService: https://www.halaxy.com/article/terms/practitioner
  contact:
    name: Halaxy Developers
    url: https://www.halaxy.com
    email: community@halaxy.com
  version: '1.104'
servers:
- url: https://au-api.halaxy.com
  description: Production AU
- url: https://eu-api.halaxy.com
  description: Production EU
security:
- oauth: []
tags:
- name: InvoiceLine
paths:
  /main/InvoiceLine:
    get:
      operationId: findInvoiceLine
      tags:
      - InvoiceLine
      responses:
        '200':
          description: InvoiceLine collection
          content:
            application/fhir+json:
              schema:
                type: object
                readOnly: true
                properties:
                  resourceType:
                    type: string
                    readOnly: true
                    enum:
                    - Bundle
                    default: Bundle
                  timestamp:
                    type: string
                    readOnly: true
                    format: date-time
                  type:
                    type: string
                    readOnly: true
                    enum:
                    - searchset
                    default: searchset
                  entry:
                    type: array
                    items:
                      type: object
                      properties:
                        fullUrl:
                          type: string
                          format: iri-reference
                        resource:
                          type: array
                          items:
                            $ref: '#/components/schemas/InvoiceLine.jsonfhir'
                        search:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                              - match
                              - include
                              - outcome
                  total:
                    type: integer
                    readOnly: true
                    minimum: 0
                  link:
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        relation:
                          type: string
                          readOnly: true
                          enum:
                          - self
                          - first
                          - last
                          - prev
                          - next
                        url:
                          type: string
                          readOnly: true
                          format: iri-reference
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceLine'
        '403':
          description: Forbidden
      summary: List Invoice Lines
      description: Retrieves a list or collection of invoice lines (i.e. a fee added to an invoice)
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: _count
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 30
          minimum: 0
        style: form
        explode: false
      - name: pagination
        in: query
        description: Enable or disable pagination
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: _id
        in: query
        description: The logical id of the resource
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: created
        in: query
        description: When the resource was created.
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      - name: subject
        in: query
        description: Patient who is the subject of the invoice line
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: performer
        in: query
        description: Reference to the performer for the invoice line.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: invoice
        in: query
        description: Reference to the invoice it belong.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: funder
        in: query
        description: Reference to the funder it belong.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: referral
        in: query
        description: Reference to the referral it belong.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: coverage
        in: query
        description: Reference to the claim it belong.
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: _lastUpdated
        in: query
        description: Date the invoice line was last updated.
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      - name: amount
        in: query
        description: The amount of the invoice line
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: _include
        in: query
        description: 'The `_include` parameter can be used to include related search results to reduce overall network delay of repeated retrievals of related resources.


          **Modifiers**

          - `_include:iterate` = can be used to include related resources based on already included resources.'
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - InvoiceLine:subject
          - InvoiceLine:performer
          - InvoiceLine:invoice
        style: form
        explode: false
      deprecated: false
  /main/InvoiceLine/{id}:
    get:
      operationId: getInvoiceLine
      tags:
      - InvoiceLine
      responses:
        '200':
          description: InvoiceLine resource
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/InvoiceLine.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLine'
        '403':
          description: Forbidden
        '404':
          description: Resource not found
      summary: Get Invoice Line
      description: Retrieves an individual invoice line (i.e. a fee added to an invoice)
      parameters:
      - name: id
        in: path
        description: InvoiceLine identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      deprecated: false
