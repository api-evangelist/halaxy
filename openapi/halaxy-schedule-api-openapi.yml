    Schedule.ScheduleGenerateInput:
      type: object
      description: 'Schedule resources provide a container for time-slots that can be booked using an appointment. It provides the window of time (period) that slots are defined for and what type of appointments can be booked.

        The schedule does not provide any information about actual appointments. This separation greatly assists where access to the appointments would not be permitted for security or privacy reasons, while still being able to determine if an appointment might be available.'
      deprecated: false
      properties:
        period:
          description: The period to generate slots with the Schedules planing horizon. Leave blank to re-generate to entire planning horizon
          anyOf:
          - $ref: '#/components/schemas/FhirPeriodDateTime'
          - type: 'null'
        updatePlanningHorizon:
          description: Pass true to update the planning horizon. Default is false.
          type:
          - boolean
          - 'null'
    Schedule.BundleResource:
      type: object
      description: 'Schedule resources provide a container for time-slots that can be booked using an appointment. It provides the window of time (period) that slots are defined for and what type of appointments can be booked.

        The schedule does not provide any information about actual appointments. This separation greatly assists where access to the appointments would not be permitted for security or privacy reasons, while still being able to determine if an appointment might be available.'
