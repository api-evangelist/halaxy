openapi: 3.2.0
info:
  title: Halaxy Schedule API
  description: A FHIR API for Halaxy based on R4 of the FHIR specification
  termsOfService: https://www.halaxy.com/article/terms/practitioner
  contact:
    name: Halaxy Developers
    url: https://www.halaxy.com
    email: community@halaxy.com
  version: '1.104'
servers:
- url: https://au-api.halaxy.com
  description: Production AU
- url: https://eu-api.halaxy.com
  description: Production EU
security:
- oauth: []
tags:
- name: Schedule
paths:
  /main/Schedule:
    get:
      operationId: findSchedules
      tags:
      - Schedule
      responses:
        '200':
          description: Schedule collection
          content:
            application/fhir+json:
              schema:
                type: object
                readOnly: true
                properties:
                  resourceType:
                    type: string
                    readOnly: true
                    enum:
                    - Bundle
                    default: Bundle
                  timestamp:
                    type: string
                    readOnly: true
                    format: date-time
                  type:
                    type: string
                    readOnly: true
                    enum:
                    - searchset
                    default: searchset
                  entry:
                    type: array
                    items:
                      type: object
                      properties:
                        fullUrl:
                          type: string
                          format: iri-reference
                        resource:
                          type: array
                          items:
                            $ref: '#/components/schemas/Schedule.jsonfhir'
                        search:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                              - match
                              - include
                              - outcome
                  total:
                    type: integer
                    readOnly: true
                    minimum: 0
                  link:
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        relation:
                          type: string
                          readOnly: true
                          enum:
                          - self
                          - first
                          - last
                          - prev
                          - next
                        url:
                          type: string
                          readOnly: true
                          format: iri-reference
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
        '403':
          description: Forbidden
      summary: List Schedules
      description: Retrieves a collection of practitioner schedules in a practice group
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: _count
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 30
          minimum: 0
        style: form
        explode: false
      - name: pagination
        in: query
        description: Enable or disable pagination
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: _id
        in: query
        description: The logical id of the resource
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: active
        in: query
        description: Whether the schedule is active
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: actor
        in: query
        description: The Resource that the Schedule is provided for
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: _include
        in: query
        description: 'The `_include` parameter can be used to include related search results to reduce overall network delay of repeated retrievals of related resources.


          **Modifiers**

          - `_include:iterate` = can be used to include related resources based on already included resources.'
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - Schedule:actor
        style: form
        explode: false
      deprecated: false
    post:
      operationId: createSchedule
      tags:
      - Schedule
      responses:
        '201':
          description: Schedule resource created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Schedule.jsonfhir'
              example:
                active: true
                planningHorizon:
                  start: '2025-06-05'
                  end: '2025-12-05'
                actor:
                - reference: https://au-api.halaxy.com/main/PractitionerRole/PR-123456
                  type: PractitionerRole
                - reference: https://au-api.halaxy.com/main/Practitioner/PR-1234567
                  type: Practitioner
                - reference: https://au-api.halaxy.com/main/Organization/CL-123456
                  type: Organization
                id: 01973ef1-e9ae-70ed-ad81-c749345df3f4
                meta:
                  lastUpdated: '2025-06-05T07:15:30+00:00'
                resourceType: Schedule
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
          links: {}
        '400':
          description: Invalid input
        '422':
          description: Unprocessable entity
      summary: Create Schedule
      description: Schedule resources provide a container for time-slots that can be booked using an appointment. It provides the window of time (period) that slots are defined for and what type of appointments can be booked.
      parameters: []
      requestBody:
        description: ''
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Schedule.jsonfhir'
            example:
              actor:
              - reference: PractitionerRole/PR-123456
                type: PractitionerRole
              active: true
              resourceType: PractitionerRole
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
        required: false
      deprecated: false
  /main/Schedule/{id}:
    get:
      operationId: getSchedule
      tags:
      - Schedule
      responses:
        '200':
          description: Schedule resource
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Schedule.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '403':
          description: Forbidden
        '404':
          description: Resource not found
      summary: Get Schedule
      description: Retrieves an individual schedule
      parameters:
      - name: id
        in: path
        description: Schedule identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      deprecated: false
  /main/Schedule/{id}/$generate:
    post:
      operationId: generateScheduleSlots
      tags:
      - Schedule
      responses:
        '201':
          description: Schedule resource created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Schedule.BundleResource.jsonfhir'
              example:
                parameter:
                - name: slot
                  resource:
                    schedule:
                      reference: https://au-api.halaxy.com/main/Schedule/01961d52-8102-7b3a-ad34-25bbec805754
                      type: Schedule
                    status: free
                    start: '2025-06-06T09:50:00+10:00'
                    end: '2025-06-06T17:00:00+10:00'
                    overbooked: false
                    actor:
                    - reference: https://au-api.halaxy.com/main/Practitioner/PR-1014021
                      type: Practitioner
                    - reference: https://au-api.halaxy.com/main/Organization/CL-770121
                      type: Organization
                    - reference: https://au-api.halaxy.com/main/PractitionerRole/PR-1650721
                      type: PractitionerRole
                    id: 01973e6a-0b4f-7115-881c-dc551c45b6c1
                    meta:
                      lastUpdated: '2025-06-05T04:47:06+00:00'
                    resourceType: Slot
                - name: slot
                  resource:
                    schedule:
                      reference: https://au-api.halaxy.com/main/Schedule/01961d52-8102-7b3a-ad34-25bbec805754
                      type: Schedule
                    status: free
                    start: '2025-06-06T09:50:00+10:00'
                    end: '2025-06-06T13:00:00+10:00'
                    overbooked: false
                    actor:
                    - reference: https://au-api.halaxy.com/main/Practitioner/PR-1014021
                      type: Practitioner
                    - reference: https://au-api.halaxy.com/main/Organization/CL-770121
                      type: Organization
                    - reference: https://au-api.halaxy.com/main/PractitionerRole/PR-1650721
                      type: PractitionerRole
                    id: 01973e6a-0b4f-7115-881c-dc551c66b775
                    meta:
                      lastUpdated: '2025-06-05T04:47:06+00:00'
                    resourceType: Slot
                - name: slot
                  resource:
                    schedule:
                      reference: https://au-api.halaxy.com/main/Schedule/01961d52-8102-7b3a-ad34-25bbec805754
                      type: Schedule
                    status: busy-unavailable
                    start: '2025-06-07T00:00:00+10:00'
                    end: '2025-06-07T23:59:59+10:00'
                    overbooked: false
                    actor:
                    - reference: https://au-api.halaxy.com/main/Practitioner/PR-1014021
                      type: Practitioner
                    - reference: https://au-api.halaxy.com/main/Organization/CL-770121
                      type: Organization
                    - reference: https://au-api.halaxy.com/main/PractitionerRole/PR-1650721
                      type: PractitionerRole
                    id: 01973e6a-0b4f-7115-881c-dc551d2177c2
                    meta:
                      lastUpdated: '2025-06-05T04:47:06+00:00'
                    resourceType: Slot
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule.BundleResource'
          links: {}
        '400':
          description: Invalid input
        '403':
          description: Forbidden
        '422':
          description: Unprocessable entity
      summary: Generate Schedule Slots
      description: The `$generate` operation populates the Slots for a Schedule. It will use the online booking preferences to ensure that the available times adhere to buffer time, lead time and advance booking limit.
      parameters:
      - name: id
        in: path
        description: Schedule identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      - name: prefer
        in: header
        description: Specifies whether the response is immediate or asynchronous. Setting this to respond-async triggers the async pattern.
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - respond-async
          example: respond-async
        style: simple
        explode: false
      requestBody:
        description: The new Schedule resource
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Schedule.ScheduleGenerateInput.jsonfhir'
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule.ScheduleGenerateInput'
        required: true
      deprecated: false
