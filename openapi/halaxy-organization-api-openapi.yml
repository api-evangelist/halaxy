openapi: 3.2.0
info:
  title: Halaxy Organization API
  description: A FHIR API for Halaxy based on R4 of the FHIR specification
  termsOfService: https://www.halaxy.com/article/terms/practitioner
  contact:
    name: Halaxy Developers
    url: https://www.halaxy.com
    email: community@halaxy.com
  version: '1.104'
servers:
- url: https://au-api.halaxy.com
  description: Production AU
- url: https://eu-api.halaxy.com
  description: Production EU
security:
- oauth: []
tags:
- name: Organization
paths:
  /main/Organization:
    get:
      operationId: findOrganization
      tags:
      - Organization
      responses:
        '200':
          description: Organization collection
          content:
            application/fhir+json:
              schema:
                type: object
                readOnly: true
                properties:
                  resourceType:
                    type: string
                    readOnly: true
                    enum:
                    - Bundle
                    default: Bundle
                  timestamp:
                    type: string
                    readOnly: true
                    format: date-time
                  type:
                    type: string
                    readOnly: true
                    enum:
                    - searchset
                    default: searchset
                  entry:
                    type: array
                    items:
                      type: object
                      properties:
                        fullUrl:
                          type: string
                          format: iri-reference
                        resource:
                          type: array
                          items:
                            $ref: '#/components/schemas/Organization.jsonfhir'
                        search:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                              - match
                              - include
                              - outcome
                  total:
                    type: integer
                    readOnly: true
                    minimum: 0
                  link:
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        relation:
                          type: string
                          readOnly: true
                          enum:
                          - self
                          - first
                          - last
                          - prev
                          - next
                        url:
                          type: string
                          readOnly: true
                          format: iri-reference
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '403':
          description: Forbidden
      summary: List Organizations
      description: Retrieves a collection of organizations in a practice group
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: _count
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 30
          minimum: 0
        style: form
        explode: false
      - name: pagination
        in: query
        description: Enable or disable pagination
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: _summary[]
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: array
          items:
            type: string
            enum:
            - 'false'
            - data
            - count
            - Default
            - text
        style: form
        explode: true
      - name: _id
        in: query
        description: The logical id of the resource
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: name
        in: query
        description: Organization name
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: _lastUpdated
        in: query
        description: Organization _lastUpdated
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      - name: _profile
        in: query
        description: The `_profile` parameter can be used to select different types of a resources.
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - StructureDefinition/hx-organization-practice-group
          - StructureDefinition/hx-organization-clinic
          - StructureDefinition/hx-organization-funder
          - StructureDefinition/hx-organization-organisation
          - StructureDefinition/hx-organization-external-clinic
          - StructureDefinition/hx-organization-external-clinic
        style: form
        explode: false
      deprecated: false
    post:
      operationId: createOrganisation
      tags:
      - Organization
      responses:
        '201':
          description: Organization resource created
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Organization.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          links: {}
        '400':
          description: Invalid input
        '403':
          description: Forbidden
        '422':
          description: Unprocessable entity
      summary: Create Organization (Professional Contact Practice)
      description: Creates a new organization record for a professional contact's practice location
      parameters: []
      requestBody:
        description: The new Organization resource
        content:
          application/fhir+json:
            schema:
              $ref: '#/components/schemas/Organization.jsonfhir'
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
        required: true
      deprecated: false
  /main/Organization/{id}:
    get:
      operationId: getOrganization
      tags:
      - Organization
      responses:
        '200':
          description: Organization resource
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Organization.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: Forbidden
        '404':
          description: Resource not found
      summary: Get Organization
      description: Retrieves an individual organization
      parameters:
      - name: id
        in: path
        description: Organization identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      deprecated: false
