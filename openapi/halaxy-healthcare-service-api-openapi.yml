openapi: 3.2.0
info:
  title: Halaxy Healthcare Service API
  description: A FHIR API for Halaxy based on R4 of the FHIR specification
  termsOfService: https://www.halaxy.com/article/terms/practitioner
  contact:
    name: Halaxy Developers
    url: https://www.halaxy.com
    email: community@halaxy.com
  version: '1.104'
servers:
- url: https://au-api.halaxy.com
  description: Production AU
- url: https://eu-api.halaxy.com
  description: Production EU
security:
- oauth: []
tags:
- name: Healthcare Service
paths:
  /main/HealthcareService:
    get:
      operationId: findHealthcareService
      tags:
      - Healthcare Service
      responses:
        '200':
          description: HealthcareService collection
          content:
            application/fhir+json:
              schema:
                type: object
                readOnly: true
                properties:
                  resourceType:
                    type: string
                    readOnly: true
                    enum:
                    - Bundle
                    default: Bundle
                  timestamp:
                    type: string
                    readOnly: true
                    format: date-time
                  type:
                    type: string
                    readOnly: true
                    enum:
                    - searchset
                    default: searchset
                  entry:
                    type: array
                    items:
                      type: object
                      properties:
                        fullUrl:
                          type: string
                          format: iri-reference
                        resource:
                          type: array
                          items:
                            $ref: '#/components/schemas/HealthcareService.jsonfhir'
                        search:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                              - match
                              - include
                              - outcome
                  total:
                    type: integer
                    readOnly: true
                    minimum: 0
                  link:
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        relation:
                          type: string
                          readOnly: true
                          enum:
                          - self
                          - first
                          - last
                          - prev
                          - next
                        url:
                          type: string
                          readOnly: true
                          format: iri-reference
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthcareService'
        '403':
          description: Forbidden
      summary: List HealthcareService
      description: Retrieves a list or collection of appointment types
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: _count
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 30
          minimum: 0
        style: form
        explode: false
      - name: pagination
        in: query
        description: Enable or disable pagination
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: _id
        in: query
        description: The logical id of the resource
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: active
        in: query
        description: Whether this healthcare service record is in active use.
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: name
        in: query
        description: Description of services as presented to a consumer while searching
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      deprecated: false
  /main/HealthcareService/{id}:
    get:
      operationId: getHealthcareService
      tags:
      - Healthcare Service
      responses:
        '200':
          description: HealthcareService resource
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/HealthcareService.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/HealthcareService'
        '403':
          description: Forbidden
        '404':
          description: Resource not found
      summary: Get HealthcareService
      description: Retrieves a specific appointment type
      parameters:
      - name: id
        in: path
        description: HealthcareService identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      deprecated: false
