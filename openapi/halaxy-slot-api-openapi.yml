    Slot:
      type: object
      description: "Slot resources are used to provide time-slots that can be booked using an appointment. They do not provide any information about \n    appointments that are available, just the time, and optionally what the time can be used for. These are effectively spaces of free/busy time.\nSlots can also be marked as busy without having appointments associated."
      deprecated: false
      properties:
        schedule:
          description: The schedule resource that this slot defines an interval of status information
          $ref: '#/components/schemas/FhirReference'
        status:
          description: busy | free | busy-unavailable | busy-tentative | entered-in-error
          type: string
          enum:
          - busy
          - free
          - busy-unavailable
          - busy-tentative
          - entered-in-error
        start:
          description: Date/Time that the slot is to begin
          type: string
          format: date-time
        end:
          description: Date/Time that the slot is to conclude
          type: string
          format: date-time
        overbooked:
          description: This slot has already been overbooked, appointments are unlikely to be accepted for this time
          type:
          - boolean
          - 'null'
        actor:
          minItems: 1
          uniqueItems: true
          description: This slot has already been overbooked, appointments are unlikely to be accepted for this time
          type: array
          items:
            $ref: '#/components/schemas/FhirReference'
        comment:
          writeOnly: true
          description: Comments on the slot to describe any extended information. Such as custom constraints on the slot
          type:
          - string
          - 'null'
        text:
          readOnly: true
          description: Text summary of the resource, for human interpretation
          anyOf:
          - $ref: '#/components/schemas/FhirNarrative'
          - type: 'null'
        contained:
