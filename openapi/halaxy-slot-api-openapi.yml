info:
  title: Halaxy Slot API
  description: A FHIR API for Halaxy based on R4 of the FHIR specification
  termsOfService: https://www.halaxy.com/article/terms/practitioner
  contact:
    name: Halaxy Developers
    url: https://www.halaxy.com
    email: community@halaxy.com
  version: '1.104'
servers:
- url: https://au-api.halaxy.com
  description: Production AU
- url: https://eu-api.halaxy.com
  description: Production EU
security:
- oauth: []
tags:
- name: Slot
paths:
  /main/Slot:
    get:
      operationId: findSlots
      tags:
      - Slot
      responses:
        '200':
          description: Slot collection
          content:
            application/fhir+json:
              schema:
                type: object
                readOnly: true
                properties:
                  resourceType:
                    type: string
                    readOnly: true
                    enum:
                    - Bundle
                    default: Bundle
                  timestamp:
                    type: string
                    readOnly: true
                    format: date-time
                  type:
                    type: string
                    readOnly: true
                    enum:
                    - searchset
                    default: searchset
                  entry:
                    type: array
                    items:
                      type: object
                      properties:
                        fullUrl:
                          type: string
                          format: iri-reference
                        resource:
                          type: array
                          items:
                            $ref: '#/components/schemas/Slot.jsonfhir'
                        search:
                          type: object
                          properties:
                            mode:
                              type: string
                              enum:
                              - match
                              - include
                              - outcome
                  total:
                    type: integer
                    readOnly: true
                    minimum: 0
                  link:
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        relation:
                          type: string
                          readOnly: true
                          enum:
                          - self
                          - first
                          - last
                          - prev
                          - next
                        url:
                          type: string
                          readOnly: true
                          format: iri-reference
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '403':
          description: Forbidden
      summary: List Slots
      description: Retrieves a collection of time intervals that are available for booking appointments
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: _count
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 30
          minimum: 0
        style: form
        explode: false
      - name: pagination
        in: query
        description: Enable or disable pagination
        required: false
        deprecated: false
        schema:
          type: boolean
        style: form
        explode: false
      - name: _id
        in: query
        description: The logical id of the resource
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: duration
        in: query
        description: The duration of the slot
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: status
        in: query
        description: The free/busy status of the appointment
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: practitioner
        in: query
        description: The practitioner available for the slot
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: organization
        in: query
        description: The Organization the slot if apart of the Slot
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: practitioner-role
        in: query
        description: The PractitionerRole that is apart of the Slot
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: start
        in: query
        description: The Appointment start date/time.
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      - name: end
        in: query
        description: The Appointment end date/time.
        required: false
        deprecated: false
        schema:
          type: string
          format: datetime
        style: form
        explode: false
      - name: schedule
        in: query
        description: The schedule the slot is a part of
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: _include
        in: query
        description: 'The `_include` parameter can be used to include related search results to reduce overall network delay of repeated retrievals of related resources.


          **Modifiers**

          - `_include:iterate` = can be used to include related resources based on already included resources.'
        required: false
        deprecated: false
        schema:
          type: string
          enum:
          - Slot:practitioner
          - Slot:organization
          - Slot:practitioner-role
        style: form
        explode: false
      deprecated: false
  /main/Slot/{id}:
    get:
      operationId: getSlot
      tags:
      - Slot
      responses:
        '200':
          description: Slot resource
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Slot.jsonfhir'
            application/json:
              schema:
                $ref: '#/components/schemas/Slot'
        '403':
          description: Forbidden
        '404':
          description: Resource not found
      summary: Get Slot
      description: Retrieves an individual time interval available for booking appointments
      parameters:
      - name: id
        in: path
        description: Slot identifier
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
      deprecated: false
